<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Master · สมุดเรียนอังกฤษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#e9eef5;--paper:#fffffe;--ink:#14213d;--pencil:#5d6a80;--blue:#2c52d9;--blue-d:#1f3fb0;--blue-t:#e8edff;--red:#d9363e;--red-t:#fdecee;--hl:#ffe35c;--good:#188a5c;--good-t:#e2f5ec;--rule:#d3e0f1;--line:#d6dfeb;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.6 'Prompt','Sarabun',system-ui,sans-serif}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.3}
h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
.hand{font-family:'Caveat','Prompt',cursive;font-weight:700}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--paper);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.logo{width:40px;height:40px;border-radius:5px 12px 12px 5px;background:var(--blue);position:relative;flex:none}
.logo::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:#ffffff66}
.logo::after{content:"Aa";position:absolute;inset:0;display:grid;place-items:center;padding-left:6px;color:#fff;font:700 17px 'Caveat',cursive}
.brand b{display:block;font-size:1rem;line-height:1.2}.brand small{color:var(--pencil);font-size:.75rem}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--pencil);font-weight:500;text-align:left}
.nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:#f1f4f9}
.nav button.on{background:var(--blue-t);color:var(--blue-d);font-weight:600}
.me-chip{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;text-align:left}
.me-chip:hover{background:#f6f8fb}
.av{width:38px;height:38px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font-size:20px;flex:none}
.me-chip small{display:block;color:var(--pencil);font-size:.75rem;line-height:1.3}
.main{padding:26px clamp(16px,3.5vw,48px) 70px;max-width:1120px;width:100%;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 4px;margin:0 0 20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 15px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--pencil);font-weight:500;font-size:.9rem}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pgtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pgtitle p{color:var(--pencil);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 20px;border-radius:12px;font-weight:600;border:1px solid transparent;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.s{background:var(--paper);border-color:var(--line);color:var(--ink)}.btn.s:hover{background:#f3f6fa}
.btn.g{background:var(--good);color:#fff}
.btn.sm{min-height:36px;padding:5px 13px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--pencil)}.small{font-size:.85rem}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52% 92%,transparent 92%);padding:0 2px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 13px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:.86rem;color:var(--pencil)}
.chip.on{background:var(--blue-t);border-color:#aebdf5;color:var(--blue-d);font-weight:600}
.bar{height:9px;background:#e2e8f1;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.bar.g i{background:var(--good)}
/* notebook page: the signature surface */
.page{position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 18px;border:1px solid var(--line);border-radius:6px 18px 18px 6px;padding:20px 24px 24px 68px;box-shadow:0 1px 0 #fff inset,0 10px 28px #1b2c5114}
.page::before{content:"";position:absolute;left:48px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
.page::after{content:"";position:absolute;left:14px;top:0;bottom:0;width:16px;background:radial-gradient(circle at 8px 28px,var(--ground) 0 6px,transparent 7px) 0 0/16px 96px repeat-y}
.page .ln{line-height:32px}
.page h2.hand{font-size:2.1rem;line-height:32px;color:var(--blue-d);margin-bottom:2px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:12px;line-height:32px}
.box{width:20px;height:20px;border:2px solid var(--pencil);border-radius:4px;flex:none;display:grid;place-items:center}
.box.ok{border-color:var(--good);background:var(--good-t)}
.box.ok::after{content:"";width:6px;height:11px;border:solid var(--good);border-width:0 2.5px 2.5px 0;transform:rotate(40deg) translate(-1px,-1px)}
.stamp{position:absolute;right:22px;bottom:20px;border:3px solid var(--red);color:var(--red);padding:4px 14px;border-radius:8px;transform:rotate(-8deg);font-size:1.7rem;line-height:1.2;opacity:.85}
.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:20px;margin-bottom:26px}
.stack{display:grid;gap:14px;align-content:start}
.big{font-size:2.2rem;font-weight:700;line-height:1.1}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.dots i{aspect-ratio:1;border-radius:4px;background:#e2e8f1}.dots i.on{background:var(--good)}.dots i.t{outline:2px solid var(--blue);outline-offset:1px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);text-align:left;width:100%}
.item:hover{border-color:#b5c4e6;background:#fbfcff}
.item .ic{width:42px;height:42px;border-radius:12px;background:var(--blue-t);display:grid;place-items:center;font-size:21px;flex:none}
.item b{display:block;font-weight:600;line-height:1.35}.item small{color:var(--pencil)}
.item .go{margin-left:auto;color:var(--pencil)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.unit{padding:0;overflow:hidden}
.unit>header{display:flex;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:#f8fafd}
.unit>header .ic{font-size:26px}
.lrow{display:flex;gap:12px;align-items:center;width:100%;padding:12px 18px;text-align:left;border-bottom:1px solid #edf1f7}
.lrow:last-child{border-bottom:0}.lrow:hover{background:#f8fafd}
.lrow small{display:block;color:var(--pencil)}
.lock{opacity:.5}
/* flashcard */
.flash{position:relative;min-height:290px;display:grid;place-items:center;text-align:center;padding:26px 24px 26px 64px;cursor:pointer;user-select:none}
.flash .w{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:700;line-height:1.15}
.flash .th{font-size:1.5rem;font-weight:500;margin-top:8px}
.flash .ex{margin-top:14px;font-size:1.02rem}.flash .exth{color:var(--pencil);font-size:.92rem}
.pos{display:inline-block;font-size:.78rem;color:var(--pencil);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin-top:8px;background:var(--paper)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:10px 12px;border-bottom:1px solid #edf1f7;text-align:left;vertical-align:middle}
.tbl th{color:var(--pencil);font-weight:500;font-size:.82rem}
.say{width:36px;height:36px;border-radius:50%;background:var(--blue-t);color:var(--blue-d);display:inline-grid;place-items:center;flex:none;font-size:15px}
.say:hover{background:#d5deff}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.letter{padding:12px 6px;border-radius:12px;background:var(--paper);border:1px solid var(--line);text-align:center}
.letter:hover{border-color:var(--blue)}
.letter b{font-size:1.9rem;display:block;line-height:1.1}.letter small{display:block;color:var(--pencil);font-size:.76rem;line-height:1.35}
.teach{position:relative;background:#fffbe0;border:1px solid #f0e29a;border-radius:10px;padding:12px 16px;transform:rotate(-.4deg)}
.exbox{padding:12px 16px;border-left:4px solid var(--blue);background:var(--blue-t);border-radius:0 10px 10px 0}
.exbox b{display:block}.exbox span{color:var(--pencil);font-size:.9rem}
.formula{display:inline-block;background:var(--ink);color:#fff;padding:5px 14px;border-radius:8px;font-weight:500;font-size:.9rem}
/* session overlay */
.sess{position:fixed;inset:0;z-index:50;background:#14213dcc;display:none;align-items:center;justify-content:center;padding:14px}
.sess.open{display:flex}
.scard{width:min(720px,100%);max-height:96vh;overflow:auto;background:var(--paper);border-radius:20px;box-shadow:0 24px 70px #0006}
.s-top{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.s-top .t{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-top .m{color:var(--pencil);font-size:.88rem;white-space:nowrap}
.s-bar{padding:0 18px}
.s-body{padding:22px 22px 20px}
.q-prompt{text-align:center;font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:700;line-height:1.3;margin:6px 0 4px;overflow-wrap:anywhere}
.q-sub{text-align:center;color:var(--pencil);margin-bottom:18px;min-height:24px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:500;text-align:center;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-t)}
.opt.sel{border-color:var(--blue);background:var(--blue-t)}
.opt.ok{border-color:var(--good);background:var(--good-t);color:#0d5e3d}
.opt.no{border-color:var(--red);background:var(--red-t);color:#8d1f26}
.opt[disabled]{cursor:default}
.tin{display:flex;gap:10px;max-width:520px;margin:0 auto}
.tin input{flex:1;min-width:0;min-height:52px;padding:10px 16px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:1.1rem;background:#fff;color:var(--ink)}
.tin input:focus{border-color:var(--blue);outline:0}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 16px;border-radius:12px;min-height:56px}
.note.ok{background:var(--good-t)}.note.no{background:var(--red-t)}
.note .hand{font-size:1.7rem;line-height:1;white-space:nowrap}
.note.ok .hand{color:var(--good)}.note.no .hand{color:var(--red)}
.tick{width:30px;height:30px;flex:none}
.tick path{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .05s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cross{width:30px;height:30px;flex:none}.cross path{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round}
.s-foot{margin-top:18px;display:flex;justify-content:center}
.hud{display:flex;align-items:center;gap:14px;padding:6px 18px 2px}
.hud .boss{font-size:2.4rem;line-height:1}.hud .boss.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
.hud .hp{flex:1}.hud .hp .bar i{background:var(--red)}
.hearts{letter-spacing:2px;font-size:1.1rem}
.sum{text-align:center;padding:16px 8px}
.sum .score{font-size:3.4rem;font-weight:700;color:var(--blue-d);line-height:1.1}
.rev{display:grid;gap:8px;text-align:left;margin:16px 0}
.rev div{padding:10px 14px;border-radius:12px;background:#f4f7fb}
.rev b{display:block}.rev small{color:var(--pencil)}
.rbtn{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* builder */
.sheet{min-height:64px;padding:12px 16px;border:2px dashed #bcc9dc;border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0;font-size:1.15rem}
.sheet.bad{border-color:var(--red);background:var(--red-t)}.sheet.good{border-color:var(--good);background:var(--good-t)}
.tile{padding:8px 16px;border-radius:10px;background:var(--paper);border:2px solid var(--line);font-weight:600;font-size:1.05rem;min-height:44px}
.tile:hover:not([disabled]){border-color:var(--blue)}
.tile[disabled]{opacity:.3}
.tile.in{background:var(--blue-t);border-color:#b5c3f4}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.match .opt.done{opacity:.35;pointer-events:none}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{text-align:center;padding:16px 10px;border-radius:14px;border:1px dashed #b8c4d8;color:var(--pencil);background:#f7f9fc}
.badge.on{border:2px solid var(--red);color:var(--red);background:#fff;transform:rotate(-2deg)}
.badge:nth-child(even).on{transform:rotate(2deg)}
.badge .e{font-size:1.9rem;filter:grayscale(1);opacity:.5}.badge.on .e{filter:none;opacity:1}
.badge b{display:block;font-size:.88rem;line-height:1.3;margin-top:4px}
.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-weight:500;font-size:.9rem}
.field input,.field select{min-height:44px;padding:8px 12px;border:1px solid #c3cfdf;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.field input[type=range]{padding:0;min-height:30px}
.login{position:fixed;inset:0;z-index:80;background:var(--ground);display:none;overflow:auto;padding:24px 16px}
.login.open{display:block}
.login .box2{max-width:520px;margin:6vh auto 0}
.who{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.who .btn{flex-direction:column;min-height:84px;min-width:100px}
.who .av{width:44px;height:44px}
.avpick{display:flex;gap:8px;flex-wrap:wrap}
.avpick button{width:44px;height:44px;border-radius:50%;background:#f1f4f9;font-size:22px;border:2px solid transparent}
.avpick button.on{border-color:var(--blue);background:var(--blue-t)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;background:var(--blue-t);color:var(--blue-d);font-weight:500}
.pill.g{background:var(--good-t);color:var(--good)}.pill.r{background:var(--red-t);color:var(--red)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:900px){
 .shell{display:block}
 .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:40;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);gap:0}
 .rail .brand,.rail .me-chip{display:none}
 .nav{display:flex;width:100%;gap:2px}
 .nav button{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;text-align:center;align-items:center;justify-content:center}
 .main{padding:18px 14px 100px}
 .home-grid{grid-template-columns:1fr}
 .page{padding:18px 16px 20px 52px}.page::before{left:36px}.page::after{left:8px}
 .flash{padding-left:52px}
 .toast{bottom:100px}
}
@media(max-width:520px){.opts{grid-template-columns:1fr}.match{gap:8px}.stamp{font-size:1.15rem;right:10px;bottom:16px;padding:2px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tick path{stroke-dashoffset:0}}

</style>
</head>
<body>
<div class="shell">
 <aside class="rail">
  <div class="brand"><div class="logo"></div><div><b>English Master</b><small>สมุดเรียนอังกฤษ ระดับเริ่มต้น</small></div></div>
  <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
  <button class="me-chip" id="chip" onclick="go('me')" aria-label="โปรไฟล์ของฉัน"></button>
 </aside>
 <main class="main" id="view"></main>
</div>
<div class="sess" id="sess" role="dialog" aria-modal="true"><div class="scard" id="scard"></div></div>
<div class="login" id="login"><div class="box2" id="loginBox"></div></div>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
/* ================= DATA ================= */
const TOPICS=[
 {en:'Greetings',th:'ทักทาย',ic:'👋'},{en:'People',th:'คนและครอบครัว',ic:'👨‍👩‍👧'},{en:'Numbers & time',th:'ตัวเลขและเวลา',ic:'⏰'},
 {en:'Food & drink',th:'อาหารและเครื่องดื่ม',ic:'🍚'},{en:'Home',th:'บ้านและของใช้',ic:'🏠'},{en:'School & work',th:'โรงเรียนและงาน',ic:'🎒'},
 {en:'Places',th:'สถานที่และทิศทาง',ic:'🧭'},{en:'Actions',th:'กริยาที่ใช้บ่อย',ic:'🏃'},{en:'Feelings',th:'ความรู้สึกและลักษณะ',ic:'🙂'},
 {en:'Colors & clothes',th:'สีและเสื้อผ้า',ic:'👕'},{en:'Travel',th:'การเดินทาง',ic:'✈️'},{en:'Weather & nature',th:'อากาศและธรรมชาติ',ic:'🌤️'}
];
const RAW=[`hello|สวัสดี|interj|Hello, Mia!|สวัสดี มีอา
goodbye|ลาก่อน|interj|Goodbye, see you soon.|ลาก่อน แล้วเจอกันเร็ว ๆ นี้
good morning|สวัสดีตอนเช้า|phrase|Good morning, teacher.|สวัสดีตอนเช้าค่ะ คุณครู
good night|ราตรีสวัสดิ์|phrase|Good night, Mom.|ราตรีสวัสดิ์ค่ะแม่
please|กรุณา / ได้โปรด|adv|Please sit down.|กรุณานั่งลง
thank you|ขอบคุณ|phrase|Thank you for your help.|ขอบคุณที่ช่วย
sorry|ขอโทษ|adj|Sorry, I am late.|ขอโทษ ฉันมาสาย
welcome|ยินดีต้อนรับ|interj|Welcome to our home.|ยินดีต้อนรับสู่บ้านของเรา
excuse me|ขอโทษนะ (เรียกความสนใจ)|phrase|Excuse me, where is the toilet?|ขอโทษนะ ห้องน้ำอยู่ที่ไหน
yes|ใช่|adv|Yes, I do.|ใช่ ฉันทำ
no|ไม่ใช่ / ไม่|adv|No, thank you.|ไม่เป็นไร ขอบคุณ
see you|แล้วเจอกัน|phrase|See you tomorrow!|แล้วเจอกันพรุ่งนี้`,
`I|ฉัน / ผม|pron|I am a student.|ฉันเป็นนักเรียน
you|คุณ / เธอ|pron|You are my friend.|คุณเป็นเพื่อนของฉัน
he|เขา (ผู้ชาย)|pron|He is my brother.|เขาเป็นพี่ชายของฉัน

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const LV=[0,100,250,450,700,1000,1400,1900,2500,3200],LVN=['Hello','Friend','Speaker','Reader','Writer','Traveler','Talker','Storyteller','Explorer','Master'];
const lvl=()=>{let i=0;while(i<LV.length-1&&S.xp>=LV[i+1])i++;return i};
const lvPct=()=>{const i=lvl();return i>=LV.length-1?100:Math.round((S.xp-LV[i])/(LV[i+1]-LV[i])*100)};
function touchStreak(){const t=today();if(S.lastDay===t)return;S.streak=S.lastDay===addDays(-1)?S.streak+1:1;S.lastDay=t}
function dayLog(){return S.days[today()]||(S.days[today()]={xp:0,q:0})}
function gain(n){const b=lvl();S.xp+=n;dayLog().xp+=n;touchStreak();const a=lvl();if(a>b)toast('เลื่อนเป็น Lv.'+(a+1)+' '+LVN[a]+' 🎉');checkBadges();save()}

 ['w50','🔤','เจอคำศัพท์ 50 คำ',()=>srsCount()>=50],['w100','📚','เจอคำศัพท์ 100 คำ',()=>srsCount()>=100],['boss','⚔️','ชนะบอสครั้งแรก',()=>Object.keys(S.bossBest).length>=1],

 if(ok){if(S.wrong[k])S.wrong[k]--;if(e.due>t)return;e.stage=Math.min(5,e.stage+1);e.due=addDays(INTV[e.stage])}else{e.stage=Math.max(0,e.stage-1);e.due=addDays(1);S.wrong[k]=(S.wrong[k]||0)+1}}

/* ================= QUESTION FACTORY ================= */
function uniq(arr,not){const s=new Set([not]);return arr.filter(x=>!s.has(x)&&s.add(x))}
function distract(w,field,n=3){const same=WORDS.filter(x=>x.k!==w.k&&x.pos===w.pos),other=WORDS.filter(x=>x.k!==w.k);
 let c=uniq(shuffle(same).map(x=>x[field]),w[field]);if(c.length<n)c=c.concat(uniq(shuffle(other).map(x=>x[field]),w[field]).filter(x=>!c.includes(x)));return c.slice(0,n)}
function mkChoose(w,dir){dir=dir||(Math.random()<.5?'e':'t');
 if(dir==='e')return{type:'choose',prompt:w.en,sub:'คำนี้แปลว่าอะไร?',audio:w.en,options:shuffle([w.th,...distract(w,'th')]),answer:w.th,key:w.k,explain:`<b>${esc(w.en)}</b> = ${esc(w.th)}<br><span class="muted">${esc(w.ex)}</span>`};
 return{type:'choose',prompt:w.th,sub:'ภาษาอังกฤษคือคำไหน?',options:shuffle([w.en,...distract(w,'en')]),answer:w.en,key:w.k,explain:`<b>${esc(w.th)}</b> = ${esc(w.en)}<br><span class="muted">${esc(w.ex)}</span>`}}
function mkType(w){const ph=w.en.split('').map(c=>c===' '?'  ':'_').join(' ');return{type:'type',prompt:w.th,sub:'พิมพ์เป็นภาษาอังกฤษ  '+ph,answer:w.en,key:w.k,explain:`คำตอบคือ <b>${esc(w.en)}</b><br><span class="muted">${esc(w.ex)}</span>`}}
function mkListen(w,sent){if(sent){const o=uniq(shuffle(WORDS.filter(x=>x.k!==w.k)).map(x=>x.exth),w.exth).slice(0,3);return{type:'listen',audio:w.ex,prompt:'ฟังแล้วเลือกความหมาย',sub:'กดปุ่มเสียงเพื่อฟังซ้ำ',options:shuffle([w.exth,...o]),answer:w.exth,key:w.k,explain:`<b>${esc(w.ex)}</b><br>${esc(w.exth)}`}}
 return{type:'listen',audio:w.en,prompt:'ฟังแล้วเลือกความหมาย',sub:'กดปุ่มเสียงเพื่อฟังซ้ำ',options:shuffle([w.th,...distract(w,'th')]),answer:w.th,key:w.k,explain:`<b>${esc(w.en)}</b> = ${esc(w.th)}`}}
function mkRead(w){const o=uniq(shuffle(WORDS.filter(x=>x.k!==w.k)).map(x=>x.exth),w.exth).slice(0,3);return{type:'choose',prompt:w.ex,sub:'ประโยคนี้แปลว่าอะไร?',audio:w.ex,options:shuffle([w.exth,...o]),answer:w.exth,key:w.k,small:true,explain:`<b>${esc(w.ex)}</b><br>${esc(w.exth)}`}}
function mkRemember(w){return{type:'remember',w,key:w.k}}
function mkGrammar(gi,qi){const g=G[gi],e=g.q[qi===undefined?Math.floor(Math.random()*g.q.length):qi];const ans=e[1][e[2]];return{type:'choose',prompt:e[0],sub:'ไวยากรณ์: '+g.t,options:shuffle(e[1]),answer:ans,small:true,explain:esc(e[3])+`<br><span class="muted">${esc(e[0].replace('___',ans))}</span>`}}
function mkPhrase(p){const o=uniq(shuffle(PHRASES.filter(x=>x.en!==p.en)).map(x=>x.th),p.th).slice(0,3);return{type:'choose',prompt:p.en,sub:'ประโยคนี้แปลว่าอะไร?',audio:p.en,options:shuffle([p.th,...o]),answer:p.th,small:true,explain:`<b>${esc(p.en)}</b><br>${esc(p.th)}`}}
function mkAuthored(l){const q=l.q;return{type:'choose',prompt:q[0],sub:'',options:shuffle(q[1]),answer:q[1][q[2]],small:true,explain:esc(l.tip)}}
function mkPair(a,b){const t=Math.random()<.5?a:b;return{type:'listen',audio:t,prompt:'ได้ยินคำไหน?',sub:'เสียงคล้ายกัน ฟังให้ดี',options:shuffle([a,b]),answer:t,explain:`<b>${esc(a)}</b> ≠ <b>${esc(b)}</b>`}}
const MIX=[w=>mkChoose(w,'e'),w=>mkChoose(w,'t'),mkType,w=>mkListen(w,false),mkRead];
function buildDaily(){const t=today(),fresh=WORDS.filter(w=>!S.srs[w.k]).slice(0,3),due=shuffle(dueWords().filter(w=>!fresh.includes(w)));
 let base=[...fresh,...due.slice(0,8)];const learned=shuffle(WORDS.filter(w=>S.srs[w.k]&&!base.includes(w)));base=base.concat(learned);
 let nxt=WORDS.filter(w=>!base.includes(w));base=base.concat(shuffle(nxt));
 const rem=fresh.length?fresh:base.slice(0,3);let i=0;const nw=()=>base[(i++)%base.length];
 const qs=[...rem.map(mkRemember)];
 for(let n=0;n<3;n++)qs.push(mkRead(n<rem.length?rem[n]:nw()));
 for(let n=0;n<4;n++)qs.push(mkChoose(nw()));
 for(let n=0;n<3;n++)qs.push(mkType(n<rem.length?rem[n]:nw()));
 for(let n=0;n<2;n++)qs.push(mkListen(nw(),n===1));
 return qs}
function bossQs(ui){const u=UNITS[ui],pool=WORDS.filter(w=>u.topics.includes(w.t));const qs=[];
 pick(pool,6).forEach((w,i)=>qs.push(MIX[i%5](w)));
 u.g.forEach(g=>{qs.push(mkGrammar(g));qs.push(mkGrammar(g))});
 u.ls.forEach(l=>qs.push(mkAuthored(l)));
 u.ls.forEach(l=>qs.push(mkPhrase(l.p[Math.floor(Math.random()*l.p.length)])));
 return shuffle(qs).slice(0,14)}
function examQs(){const qs=[];pick(WORDS,6).forEach(w=>qs.push(mkChoose(w)));pick(WORDS,4).forEach((w,i)=>qs.push(mkListen(w,i%2===1)));
 pick(WORDS,2).forEach(w=>qs.push(mkRead(w)));pick(WORDS,2).forEach(w=>qs.push(mkType(w)));
 shuffle(G.map((_,i)=>i)).slice(0,6).forEach(g=>qs.push(mkGrammar(g)));return shuffle(qs)}

/* ================= SESSION ENGINE ================= */
let Sess=null;
const TICK='<svg class="tick" viewBox="0 0 40 40"><path d="M6 21l9 10L34 8"/></svg>',CROSS='<svg class="cross" viewBox="0 0 40 40"><path d="M9 9l22 22M31 9L9 31"/></svg>';
function openSession(cfg){Sess={cfg,i:0,ok:0,scored:0,bad:[],hearts:cfg.boss?3:0,hp:cfg.boss?cfg.boss.hp:0,locked:false,left:cfg.time||0,sel:null,silent:!!cfg.silent,log:[]};
 $('#sess').classList.add('open');document.body.classList.add('noscroll');
 if(cfg.time)Sess.timer=setInterval(()=>{Sess.left--;const t=$('#sTime');if(t)t.textContent=fmt(Sess.left);if(Sess.left<=0)finishSession()},1000);
 drawQ()}
const fmt=s=>pad(Math.floor(Math.max(0,s)/60))+':'+pad(Math.max(0,s)%60);
function closeSession(force){if(!Sess)return;if(!force&&!Sess.done&&Sess.i>0&&!confirm('ออกจากแบบฝึกหัดนี้? ความคืบหน้าในรอบนี้จะไม่ถูกบันทึก'))return;clearInterval(Sess.timer);try{speechSynthesis.cancel()}catch(e){}Sess=null;$('#sess').classList.remove('open');document.body.classList.remove('noscroll');render()}
function drawQ(){const c=Sess.cfg,q=c.qs[Sess.i],n=c.qs.length;Sess.locked=false;Sess.sel=null;
 let h=`<div class="s-top"><button class="btn s sm" onclick="closeSession()">ปิด</button><div class="t">${esc(c.title)}</div><div class="m">${c.time?`<span class="timer" id="sTime">${fmt(Sess.left)}</span> · `:''}${Sess.i+1}/${n}</div></div><div class="s-bar"><div class="bar"><i style="width:${Sess.i/n*100}%"></i></div></div>`;
 if(c.boss)h+=`<div class="hud"><div class="boss" id="bossE">${c.boss.e}</div><div class="hp"><div class="small muted">${esc(c.boss.n)} · พลัง ${Sess.hp}</div><div class="bar"><i style="width:${Sess.hp/c.boss.hp*100}%"></i></div></div><div class="hearts" aria-label="หัวใจ ${Sess.hearts}">${'❤️'.repeat(Sess.hearts)}${'🖤'.repeat(3-Sess.hearts)}</div></div>`;
 h+='<div class="s-body">';
 if(q.type==='remember'){const w=q.w;h+=`<div class="q-sub">จำคำนี้ไว้ แล้วเจอกันในข้อถัดไป</div><div class="page" style="text-align:center;padding-top:22px"><div class="q-prompt" style="line-height:32px">${esc(w.en)}</div><div style="font-size:1.35rem;font-weight:500;margin-top:10px">${esc(w.th)}</div><span class="pos">${esc(w.pos)}</span><div style="margin-top:12px">${esc(w.ex)}<div class="muted small">${esc(w.exth)}</div></div></div><div class="s-foot" style="gap:10px"><button class="btn s" onclick="say(Q().w.en)">🔊 ฟังเสียง</button><button class="btn p" onclick="remembered()">จำได้แล้ว</button></div>`;
  setTimeout(()=>say(w.en),250)}
 else{h+=`<div class="q-prompt"${q.small?' style="font-size:clamp(1.15rem,3.6vw,1.55rem)"':''}>${esc(q.prompt)}</div><div class="q-sub">${esc(q.sub||'')}</div>`;
  if(q.audio)h+=`<div class="row c" style="margin-bottom:16px"><button class="btn s" onclick="say(Q().audio)">🔊 ฟังเสียง</button></div>`;
  if(q.type==='type')h+=`<div class="tin"><input id="tIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ" aria-label="คำตอบ"><button class="btn p" id="tOk" onclick="submitType()">ตรวจ</button></div>`;
  else h+=`<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pickOpt(${i})">${esc(o)}</button>`).join('')}</div>`;
  h+=`<div id="fb"></div><div class="s-foot"><button class="btn p" id="nxt" onclick="nextQ()" ${c.silent&&q.type!=='type'?'disabled':'style="display:none"'}>${Sess.i===n-1?'ดูผล':'ข้อต่อไป'}</button></div>`}
 h+='</div>';$('#scard').innerHTML=h;
 if(q.type==='type'){const i=$('#tIn');i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();Sess.locked?nextQ():submitType()}})}
 if((q.type==='listen')&&q.audio)setTimeout(()=>say(q.audio),250)}
const Q=()=>Sess.cfg.qs[Sess.i];
function remembered(){const q=Q();if(!S.srs[q.key])S.srs[q.key]={stage:0,due:addDays(1)};Sess.i++;Sess.i>=Sess.cfg.qs.length?finishSession():drawQ()}
function pickOpt(i){if(Sess.locked)return;const q=Q(),val=q.options[i];
 if(Sess.silent){Sess.sel=val;$$('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));$('#nxt').disabled=false;return}
 grade(val,i)}
function submitType(){if(Sess.locked)return;const v=$('#tIn').value;if(!norm(v)){$('#tIn').focus();return}
 if(Sess.silent){Sess.sel=v;Sess.locked=true;$('#tIn').disabled=true;recordSilent();nextQ();return}grade(v)}
function recordSilent(){const q=Q(),ok=q.type==='type'?norm(Sess.sel)===norm(q.answer):Sess.sel===q.answer;Sess.scored++;if(ok)Sess.ok++;else Sess.bad.push(q);Sess.log.push(ok)}
function grade(val,idx){const q=Q(),ok=q.type==='type'?norm(val)===norm(q.answer):val===q.answer;Sess.locked=true;Sess.scored++;S.stats.t++;
 if(ok){Sess.ok++;S.stats.c++}else Sess.bad.push(q);
 if(q.key)srsMark(q.key,ok);
 $$('.opt').forEach(b=>{b.disabled=true;if(q.options[+b.dataset.i]===q.answer)b.classList.add('ok');else if(+b.dataset.i===idx)b.classList.add('no')});
 if(q.type==='type'){$('#tIn').disabled=true;$('#tOk').style.display='none'}
 const c=Sess.cfg;
 if(c.boss){if(ok){Sess.hp--;const e=$('#bossE');e&&e.classList.add('hit')}else Sess.hearts--}
 $('#fb').innerHTML=`<div class="note ${ok?'ok':'no'}">${ok?TICK:CROSS}<div><span class="hand">${ok?pick(['Good!','Nice!','Perfect!','Great!'],1)[0]:'Not yet'}</span><div class="small" style="margin-top:4px">${q.explain||''}</div></div></div>`;
 const nb=$('#nxt');nb.style.display='';nb.focus();
 if(c.boss&&(Sess.hp<=0||Sess.hearts<=0))nb.textContent='ดูผล';
 save()}
function nextQ(){const c=Sess.cfg;if(!Sess.silent&&!Sess.locked)return;
 if(Sess.silent&&Sess.cfg.qs[Sess.i].type!=='type')recordSilent();
 if(c.boss&&(Sess.hp<=0||Sess.hearts<=0)){finishSession();return}
 Sess.i++;Sess.i>=c.qs.length?finishSession():drawQ()}
function finishSession(){if(!Sess||Sess.done)return;Sess.done=true;clearInterval(Sess.timer);const c=Sess.cfg;
 if(c.time&&Sess.silent){const cur=c.qs[Sess.i];if(Sess.i===Sess.scored&&cur&&cur.type!=='type'&&Sess.sel!==null)recordSilent();c.qs.slice(Sess.scored).forEach(q=>{Sess.scored++;Sess.bad.push(q)})}
 const pct=Sess.scored?Math.round(Sess.ok/Sess.scored*100):0;const res={ok:Sess.ok,total:Sess.scored,pct,bad:Sess.bad,won:c.boss?Sess.hp<=0:pct>=60,hearts:Sess.hearts};
 const extra=c.onDone?c.onDone(res)||'':'';
 const bad=Sess.bad.filter((q,i,a)=>q.prompt&&a.findIndex(x=>x.prompt===q.prompt)===i).slice(0,8);
 let head;
 if(c.boss)head=res.won?`<div style="font-size:3.4rem">🏆</div><h2>ชนะ ${esc(c.boss.n)} แล้ว!</h2>`:`<div style="font-size:3.4rem">${c.boss.e}</div><h2>ครั้งนี้บอสยังชนะอยู่</h2><p class="muted">ทบทวนข้อที่พลาดแล้วกลับมาท้าใหม่</p>`;
 else head=`<div class="score">${res.ok}/${res.total}</div><h2>${pct>=90?'ยอดเยี่ยมมาก':pct>=70?'ทำได้ดีมาก':pct>=50?'ผ่านไปได้ด้วยดี':'ไม่เป็นไร ลองใหม่อีกรอบ'}</h2>`;
 $('#scard').innerHTML=`<div class="s-top"><div class="t">${esc(c.title)}</div></div><div class="s-body"><div class="sum">${head}<div class="muted" style="margin-top:6px">${extra}</div></div>${bad.length?`<h3>ข้อที่ควรทบทวน</h3><div class="rev">${bad.map(q=>`<div><b>${esc(q.prompt)}</b><small>${q.explain||''}</small></div>`).join('')}</div>`:''}<div class="rbtn"><button class="btn s" onclick="closeSession(true)">ปิด</button>${c.again?`<button class="btn p" onclick="const f=Sess.cfg.again;closeSession(true);f()">ทำอีกครั้ง</button>`:''}</div></div>`;save()}

 <div class="stack">
  <div class="card"><div class="small muted">เรียนต่อเนื่อง</div><div class="big">${S.streak} <span class="small muted" style="font-weight:400">วัน</span></div><div class="dots" aria-label="14 วันล่าสุด">${dots}</div></div>

 </div></div>

 ${nl?`<button class="item" onclick="openLesson(${nl[0]},${nl[1]})"><span class="ic">${UNITS[nl[0]].ic}</span><span><b>Unit ${nl[0]+1}: ${esc(UNITS[nl[0]].ls[nl[1]].t)}</b><small>${esc(UNITS[nl[0]].ls[nl[1]].goal)}</small></span><span class="go">เปิด</span></button>`:`<div class="item"><span class="ic">🏆</span><span><b>จบครบทุกบทเรียนแล้ว</b><small>ลองท้าทายข้อสอบจำลองหรือบอสประจำบท</small></span></div>`}

/* speak */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let SPK={p:null,res:null,rec:null,on:false};
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=Array(n+1).fill(0);r[0]=i;return r});for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
PANES['practice.speak']=()=>{if(!SPK.p)SPK.p=pick(PHRASES,1)[0];const p=SPK.p,r=SPK.res;
 pane(H('ฝึกพูด','ฟังตัวอย่าง แล้วพูดตามให้ใกล้เคียงที่สุด')+`<section class="page"><div class="small muted ln">พูดประโยคนี้</div><div style="font-size:1.7rem;font-weight:700;line-height:1.4">${esc(p.en)}</div><div class="muted ln">${esc(p.th)}</div>
 <div class="row" style="margin-top:14px"><button class="btn s" onclick="say(SPK.p.en)">🔊 ฟังตัวอย่าง</button>${SR?`<button class="btn p" id="micBtn" onclick="speakStart()">🎙️ กดแล้วพูด</button>`:`<button class="btn g" onclick="speakSelf()">ฉันพูดตามแล้ว</button>`}<button class="btn s" onclick="SPK.p=pick(PHRASES,1)[0];SPK.res=null;PANES['practice.speak']()">ประโยคอื่น</button></div>
 ${SR?'':'<p class="small muted" style="margin-top:10px">เบราว์เซอร์นี้ไม่รองรับการจับเสียงพูด ลองใช้ Chrome หรือ Edge เพื่อให้ระบบให้คะแนน</p>'}
 ${r?`<div style="margin-top:16px"><div class="small muted">ระบบได้ยินว่า</div><b>${esc(r.t||'(ไม่ได้ยินเสียง)')}</b><div class="bar ${r.s>=.85?'g':''}" style="margin:8px 0"><i style="width:${Math.round(r.s*100)}%"></i></div><div class="hand" style="font-size:1.6rem;color:${r.s>=.6?'var(--good)':'var(--red)'}">${r.s>=.85?'Excellent!':r.s>=.6?'Good, try once more':'Not yet — listen again'} (${Math.round(r.s*100)}%)</div></div>`:''}</section>`)};
function speakStart(){if(SPK.on)return;try{const rec=new SR();SPK.rec=rec;SPK.on=true;rec.lang=S.set.accent;rec.interimResults=false;rec.maxAlternatives=3;const b=$('#micBtn');if(b)b.textContent='กำลังฟัง…';
 rec.onresult=e=>{let best='',bs=0;[...e.results[0]].forEach(a=>{const s=1-lev(norm(a.transcript),norm(SPK.p.en))/Math.max(norm(a.transcript).length,norm(SPK.p.en).length,1);if(s>=bs){bs=s;best=a.transcript}});SPK.res={t:best,s:bs};if(bs>=.85)gain(10);else if(bs>=.6)gain(5)};
 rec.onerror=()=>{SPK.res={t:'',s:0};toast('ไม่ได้รับเสียง ตรวจสอบสิทธิ์ไมโครโฟน')};rec.onend=()=>{SPK.on=false;if(nav.sec==='practice'&&nav.tab.practice==='speak')PANES['practice.speak']()};rec.start()}catch(e){SPK.on=false;toast('เริ่มไมโครโฟนไม่ได้')}}
function speakSelf(){gain(3);toast('บันทึกแล้ว +3 XP');SPK.p=pick(PHRASES,1)[0];SPK.res=null;PANES['practice.speak']()}

/* sentence builder */
let B={i:0,ord:null,tiles:[],built:[],done:false,en:'',th:''};
PANES['practice.build']=()=>{if(!B.ord)B.ord=shuffle(BUILD.map((_,i)=>i));const e=BUILD[B.ord[B.i%BUILD.length]];B.th=e[0];B.en=e[1];B.tiles=shuffle(B.en.replace(/[.,?!]/g,'').split(' ').map((w,i)=>({w,i})));B.built=[];B.done=false;drawBuild()};
function drawBuild(msg){pane(H('เรียงประโยค',`ประโยคที่ ${B.i%BUILD.length+1} / ${BUILD.length}`)+`<section class="page"><div class="small muted ln">แปลเป็นภาษาอังกฤษ</div><div style="font-size:1.5rem;font-weight:600;line-height:1.4">${esc(B.th)}</div>
 <div class="sheet ${B.cls||''}" id="sheet" aria-live="polite">${B.built.length?B.built.map(i=>`<button class="tile in" onclick="bRemove(${i})">${esc(B.tiles.find(t=>t.i===i).w)}</button>`).join(''):'<span class="muted">แตะคำด้านล่างเพื่อเรียงประโยค</span>'}</div>
 <div class="row">${B.tiles.map(t=>`<button class="tile" ${B.built.includes(t.i)?'disabled':''} onclick="bAdd(${t.i})">${esc(t.w)}</button>`).join('')}</div>
 <div class="note ${B.cls==='good'?'ok':B.cls==='bad'?'no':''}" style="${msg?'':'display:none'}">${msg||''}</div>
 <div class="row" style="margin-top:16px"><button class="btn s" onclick="B.built=[];B.cls='';drawBuild()">ล้าง</button><button class="btn p" onclick="bCheck()" ${B.built.length?'':'disabled'}>ตรวจคำตอบ</button><button class="btn s" onclick="B.i++;B.cls='';PANES['practice.build']()">ข้อถัดไป</button></div></section>`);B.cls=''}
function bAdd(i){if(B.done)return;B.built.push(i);drawBuild()}
function bRemove(i){if(B.done)return;B.built=B.built.filter(x=>x!==i);drawBuild()}
function bCheck(){const got=B.built.map(i=>B.tiles.find(t=>t.i===i).w).join(' ').toLowerCase(),ok=got===norm(B.en);
 if(ok&&!B.done){B.done=true;gain(10);B.cls='good';pane0(`${TICK}<div><span class="hand">Perfect!</span><div class="small"><b>${esc(B.en)}</b> +10 XP</div></div>`,'good')}else if(ok){B.cls='good'}
 else{B.cls='bad';pane0(`${CROSS}<div><span class="hand">Not yet</span><div class="small">ลองดูลำดับคำอีกครั้ง แตะคำในช่องเพื่อนำออก</div></div>`,'bad')}}
function pane0(msg,cls){B.cls=cls;const keep=B.cls;drawBuild(msg);$('#sheet').className='sheet '+keep}

/* speed */
let SP=null;
PANES['practice.speed']=()=>pane(H('สปีดเทส 30 วินาที','เลือกความหมายให้ได้มากที่สุดก่อนเวลาหมด')+`<div class="card" style="text-align:center;padding:34px 20px"><div class="big">${S.speed}</div><div class="muted">คะแนนสูงสุด</div><button class="btn p" style="margin-top:18px" onclick="speedStart()">เริ่มเลย</button></div>`);
function speedStart(){SP={score:0,miss:0,t:30,w:null,lock:false};SP.timer=setInterval(()=>{SP.t--;const e=$('#spT');if(e)e.textContent=SP.t;if(SP.t<=0)speedEnd()},1000);speedNext()}
function speedNext(){const w=pick(WORDS,1)[0];SP.w=w;SP.o=shuffle([w.th,...distract(w,'th')]);SP.lock=false;
 pane(H('สปีดเทส',`ถูก ${SP.score} · พลาด ${SP.miss}`,`<span class="timer" style="font-size:1.6rem" id="spT">${SP.t}</span>`)+`<div class="card"><div class="q-prompt">${esc(w.en)}</div><div class="q-sub">เลือกความหมาย</div><div class="opts">${SP.o.map((o,i)=>`<button class="opt" onclick="speedPick(${i},this)">${esc(o)}</button>`).join('')}</div></div>`)}
function speedPick(i,b){if(SP.lock||SP.t<=0)return;SP.lock=true;const ok=SP.o[i]===SP.w.th;if(ok)SP.score++;else SP.miss++;srsMark(SP.w.k,ok);b.classList.add(ok?'ok':'no');setTimeout(()=>{if(SP&&SP.t>0)speedNext()},ok?150:450)}
function speedEnd(){clearInterval(SP.timer);const sc=SP.score,nb=sc>S.speed;if(nb)S.speed=sc;gain(sc*3);pane(H('สปีดเทส','หมดเวลา')+`<div class="card" style="text-align:center;padding:34px 20px"><div class="big">${sc}</div><div class="muted">ตอบถูก ${sc} · พลาด ${SP.miss}</div><p style="margin:10px 0 18px">${nb?'<span class="pill g">สถิติใหม่</span> ':''}ได้ +${sc*3} XP</p><button class="btn p" onclick="speedStart()">เล่นอีกครั้ง</button></div>`);SP=null}

/* match */
let M=null;
PANES['practice.match']=()=>pane(H('จับคู่คำศัพท์','จับคู่คำอังกฤษกับคำแปลให้ครบ 6 คู่')+`<div class="card" style="text-align:center;padding:34px 20px"><div class="big">${S.match?S.match+' วิ':'-'}</div><div class="muted">เวลาที่เร็วที่สุด</div><button class="btn p" style="margin-top:18px" onclick="matchStart()">เริ่มเกม</button></div>`);
function matchStart(){const ws=pick(WORDS,6);M={en:shuffle(ws),th:shuffle(ws),sel:null,done:[],t0:Date.now()};drawMatch()}
function drawMatch(){const m=M;pane(H('จับคู่คำศัพท์',`จับคู่แล้ว ${m.done.length}/6`)+`<div class="match"><div class="list">${m.en.map(w=>`<button class="opt ${m.done.includes(w.k)?'done':''} ${m.sel&&m.sel.s==='e'&&m.sel.k===w.k?'sel':''}" onclick="matchPick('e','${w.k.replace(/'/g,"\\'")}')">${esc(w.en)}</button>`).join('')}</div><div class="list">${m.th.map(w=>`<button class="opt ${m.done.includes(w.k)?'done':''} ${m.sel&&m.sel.s==='t'&&m.sel.k===w.k?'sel':''}" onclick="matchPick('t','${w.k.replace(/'/g,"\\'")}')">${esc(w.th)}</button>`).join('')}</div></div>`)}
function matchPick(s,k){if(!M)return;if(s==='e')say(k);if(!M.sel||M.sel.s===s){M.sel={s,k};return drawMatch()}
 if(M.sel.k===k){M.done.push(k);M.sel=null;drawMatch();if(M.done.length===6){const sec=Math.round((Date.now()-M.t0)/1000);const nb=!S.match||sec<S.match;if(nb)S.match=sec;gain(20);pane(H('จับคู่ครบแล้ว')+`<div class="card" style="text-align:center;padding:34px 20px"><div class="big">${sec} วินาที</div><p style="margin:10px 0 18px">${nb?'<span class="pill g">เวลาดีที่สุดใหม่</span> ':''}ได้ +20 XP</p><button class="btn p" onclick="matchStart()">เล่นอีกครั้ง</button></div>`);M=null}}
 else{const was=M.sel;M.sel=null;drawMatch();toast('ยังไม่ใช่คู่กัน ลองใหม่')}}

/* srs review */
let RV=false;
PANES['practice.review']=()=>{const due=dueWords();RV=false;
 if(!srsCount())return pane(H('ทบทวนอัตโนมัติ','ระบบจะนัดทบทวนที่ 1, 3, 7, 14 และ 30 วัน')+`<div class="card" style="text-align:center;padding:34px 20px"><p class="muted">ยังไม่มีคำศัพท์ในระบบ เริ่มจากภารกิจประจำวันหรือเปิดการ์ดคำศัพท์ก่อนนะ</p><button class="btn p" style="margin-top:14px" onclick="startDaily()">เริ่มภารกิจวันนี้</button></div>`);
 if(!due.length)return pane(H('ทบทวนอัตโนมัติ')+`<div class="card" style="text-align:center;padding:34px 20px"><div style="font-size:3rem">🎉</div><h3>ทบทวนครบแล้ววันนี้</h3><p class="muted">กลับมาใหม่พรุ่งนี้ ระบบจะนัดคำถัดไปให้</p></div>`);
 const w=due[0];pane(H('ทบทวนอัตโนมัติ',`เหลือ ${due.length} คำ`)+`<section class="page flash" onclick="revealReview()" tabindex="0" role="button" aria-label="เฉลย" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();revealReview()}"><div><div class="w">${esc(w.en)}</div><div id="rvA" class="muted" style="margin-top:18px">คิดความหมายก่อน แล้วแตะเพื่อเฉลย</div></div></section><div class="row c" style="margin-top:16px"><button class="btn s" onclick="say('${w.en.replace(/'/g,"\\'")}')">🔊 ฟังเสียง</button><button class="btn s" id="rvNo" disabled onclick="rateReview('${w.k.replace(/'/g,"\\'")}',false)">ยังไม่แม่น</button><button class="btn g" id="rvYes" disabled onclick="rateReview('${w.k.replace(/'/g,"\\'")}',true)">จำได้แล้ว</button></div>`)};
function revealReview(){const w=dueWords()[0];if(!w)return;RV=true;$('#rvA').innerHTML=`<div class="th">${esc(w.th)}</div><div class="ex" style="margin-top:10px">${esc(w.ex)}<div class="exth">${esc(w.exth)}</div></div>`;$('#rvA').classList.remove('muted');$('#rvNo').disabled=false;$('#rvYes').disabled=false}
function rateReview(k,ok){if(!RV)return;srsMark(k,ok);gain(ok?4:1);PANES['practice.review']()}

/* ================= CHALLENGE ================= */
PANES['challenge.boss']=()=>pane(H('บอสประจำบท','จบครบ 3 บทเรียนของหน่วยเพื่อปลดล็อก · ตอบถูกลดพลังบอส ตอบผิดเสียหัวใจ')+`<div class="grid2">${UNITS.map((u,i)=>{const un=isBossUnlocked(i);return`<div class="card" style="text-align:center"><div style="font-size:3rem;${un?'':'filter:grayscale(1);opacity:.45'}">${un?u.boss.e:'🔒'}</div><b>${esc(u.boss.n)}</b><div class="small muted" style="margin:4px 0 12px">Unit ${i+1}: ${esc(u.t)}</div>${S.bossBest[i]?`<div style="margin-bottom:10px">ชนะแล้ว ${'⭐'.repeat(S.bossBest[i])}</div>`:''}<button class="btn ${un?'p':'s'} sm" onclick="${un?`startBoss(${i})`:`toast('จบครบ 3 บทเรียนของ Unit ${i+1} ก่อน')`}">${un?(S.bossBest[i]?'ท้าดวลอีกครั้ง':'ท้าดวล'):'ยังล็อกอยู่'}</button></div>`}).join('')}</div>`);
function startBoss(ui){const u=UNITS[ui];openSession({title:'Boss: '+u.boss.n,qs:bossQs(ui),boss:{n:u.boss.n,e:u.boss.e,hp:8},again:()=>startBoss(ui),onDone:r=>{dayLog().q+=r.total;if(r.won){const first=!S.bossBest[ui];S.bossBest[ui]=Math.max(S.bossBest[ui]||0,r.hearts);const xp=100+(first?50:0)+r.hearts*10;gain(xp);return`หัวใจเหลือ ${r.hearts} ดวง · ได้ +${xp} XP`}gain(r.ok*5);return`ตอบถูก ${r.ok} ข้อ · ได้ +${r.ok*5} XP`}})}
PANES['challenge.exam']=()=>{const h=S.exam.hist.slice(-5).reverse();pane(H('ข้อสอบจำลอง A1','20 ข้อ · 15 นาที · เฉลยหลังส่งข้อสอบเท่านั้น')+`<div class="card" style="text-align:center;padding:30px 20px"><div class="big">${S.exam.best||'-'}${S.exam.best?'<span class="small muted">/100</span>':''}</div><div class="muted">คะแนนสูงสุด</div><button class="btn p" style="margin-top:18px" onclick="startExam()">เริ่มทำข้อสอบ</button></div>${h.length?`<h3 style="margin:22px 0 10px">ผลล่าสุด</h3><div class="card" style="padding:6px 16px"><table class="tbl">${h.map(x=>`<tr><td>${x.d}</td><td><b>${x.p}</b>/100</td></tr>`).join('')}</table></div>`:''}`)};
function startExam(){openSession({title:'ข้อสอบจำลอง A1',qs:examQs(),silent:true,time:900,again:startExam,onDone:r=>{S.stats.c+=r.ok;S.stats.t+=r.total;r.bad.forEach(q=>q.key&&(S.wrong[q.key]=(S.wrong[q.key]||0)+1));S.exam.best=Math.max(S.exam.best,r.pct);S.exam.hist.push({d:today(),p:r.pct});dayLog().q+=r.total;const xp=10+Math.round(r.pct/5);gain(xp);return`คะแนน ${r.pct}/100 · ${r.pct>=90?'พร้อมก้าวสู่ A2':r.pct>=70?'อยู่ในเกณฑ์ดี':r.pct>=50?'พอใช้ ทบทวนข้อที่พลาดอีกนิด':'เริ่มใหม่ได้เลย ค่อย ๆ ไปทีละบท'} · +${xp} XP`}})}

/* ================= ME ================= */
function pageMe(){const mastered=Object.values(S.srs).filter(e=>e.stage>=4).length,acc=S.stats.t?Math.round(S.stats.c/S.stats.t*100):0,weak=weakWords().slice(0,8);
 const st=(a,b)=>`<div class="card"><div class="small muted">${b}</div><div class="big">${a}</div></div>`;
 $('#view').innerHTML=H(esc(USER.name),`Lv.${lvl()+1} ${LVN[lvl()]} · ${S.xp} XP`,`<div style="min-width:200px"><div class="bar"><i style="width:${lvPct()}%"></i></div></div>`)+
 `<div class="grid2" style="margin-bottom:24px">${st(S.streak+' วัน','เรียนต่อเนื่อง')}${st(srsCount()+'/'+WORDS.length,'คำศัพท์ที่เจอแล้ว')}${st(mastered,'คำที่จำได้แม่น')}${st(acc+'%','ความแม่นยำ')}${st(S.courseDone.length+'/18','บทเรียนที่จบ')}${st(Object.keys(S.bossBest).length+'/6','บอสที่ชนะ')}</div>
 <h3 style="margin-bottom:12px">ตราประทับ</h3><div class="badges" style="margin-bottom:26px">${BADGES.map(b=>`<div class="badge ${S.badges[b[0]]?'on':''}"><div class="e">${b[1]}</div><b>${b[2]}</b></div>`).join('')}</div>
 <h3 style="margin-bottom:12px">คำที่พลาดบ่อย</h3><div class="card" style="margin-bottom:26px">${weak.length?`<div class="row">${weak.map(w=>`<span class="chip">${esc(w.en)} · ${esc(w.th)} <span class="pill r">${S.wrong[w.k]}</span></span>`).join('')}</div><button class="btn p sm" style="margin-top:12px" onclick="startWeak()">ซ่อมคำที่พลาด</button>`:'<span class="muted">ยังไม่มีคำที่พลาด</span>'}</div>
 <h3 style="margin-bottom:12px">ตั้งค่าเสียง</h3><div class="card" style="margin-bottom:26px"><div class="field"><label for="acc">สำเนียง</label><select id="acc" onchange="setSet('accent',this.value)"><option value="en-US" ${S.set.accent==='en-US'?'selected':''}>อเมริกัน (en-US)</option><option value="en-GB" ${S.set.accent==='en-GB'?'selected':''}>อังกฤษ (en-GB)</option></select></div>
 <div class="field"><label for="rate">ความเร็ว ${S.set.rate}</label><input id="rate" type="range" min=".5" max="1.1" step=".05" value="${S.set.rate}" onchange="setSet('rate',+this.value);pageMe()"></div>
 <div class="field"><label for="vc">เสียงผู้อ่าน</label><select id="vc" onchange="setSet('voice',this.value)"><option value="">อัตโนมัติ</option>${VOICES.map(v=>`<option value="${esc(v.voiceURI)}" ${S.set.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select></div><button class="btn s sm" onclick="say('Hello! Nice to meet you.')">🔊 ทดลองเสียง</button></div>
 <h3 style="margin-bottom:12px">ข้อมูลของฉัน</h3><div class="card"><p class="small muted" style="margin-bottom:12px">ความคืบหน้าบันทึกในเบราว์เซอร์เครื่องนี้ ควรสำรองไฟล์ไว้เป็นระยะ</p><div class="row"><button class="btn s" onclick="exportData()">ดาวน์โหลดไฟล์สำรอง</button><label class="btn s" for="imp" style="cursor:pointer">กู้คืนจากไฟล์</label><input id="imp" type="file" accept=".json" hidden onchange="importData(this.files[0])"><button class="btn s" onclick="showLogin()">สลับผู้ใช้</button><button class="btn s" style="color:var(--red)" onclick="resetMe()">ล้างความคืบหน้า</button></div></div>`}
function setSet(k,v){S.set[k]=v;save()}
function exportData(){const b=new Blob([JSON.stringify({app:'english-master',v:1,user:USER,data:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='english-master-'+USER.name+'-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='english-master'||!j.data)throw 0;if(!confirm('กู้คืนข้อมูลนี้จะทับความคืบหน้าปัจจุบัน ต้องการทำต่อ?'))return;S=Object.assign(DEF(),j.data);S.set=Object.assign(DEF().set,j.data.set||{});save();toast('กู้คืนข้อมูลเรียบร้อย');pageMe()}catch(e){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของ English Master')}};r.readAsText(f)}
function resetMe(){if(!confirm('ล้างความคืบหน้าทั้งหมดของ '+USER.name+'? การกระทำนี้ย้อนกลับไม่ได้'))return;const s=S.set;S=DEF();S.set=s;save();pageMe();toast('ล้างความคืบหน้าแล้ว')}

/* ================= GAMES CLEANUP ================= */
function stopGames(){if(SP&&SP.timer){clearInterval(SP.timer);SP=null}M=null;try{SPK.rec&&SPK.rec.abort()}catch(e){}SPK.on=false}

/* ================= LOGIN / BOOT ================= */
let newAv=AVATARS[0];
function showLogin(){const r=reg();$('#login').classList.add('open');
 $('#loginBox').innerHTML=`<div class="brand" style="margin-bottom:22px"><div class="logo"></div><div><b style="font-size:1.3rem">English Master</b><small>สมุดเรียนอังกฤษ ระดับเริ่มต้น</small></div></div><div class="card">${r.users.length?`<h3 style="margin-bottom:12px">ใครกำลังเรียนอยู่?</h3><div class="who">${r.users.map(u=>`<button class="btn s" onclick="pickUser('${u.id}')"><span class="av">${u.avatar}</span>${esc(u.name)}</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0">`:''}
 <h3 style="margin-bottom:12px">${r.users.length?'เพิ่มผู้เรียนใหม่':'ตั้งชื่อผู้เรียน'}</h3><div class="field"><label for="nm">ชื่อเล่น</label><input id="nm" maxlength="20" autocomplete="off" placeholder="เช่น นุ้ย" onkeydown="if(event.key==='Enter')createUser()"></div>
 <div class="field"><label>รูปประจำตัว</label><div class="avpick">${AVATARS.map(a=>`<button class="${a===newAv?'on':''}" onclick="newAv='${a}';showLogin()" aria-label="เลือก ${a}">${a}</button>`).join('')}</div></div><button class="btn p" onclick="createUser()">เริ่มเรียน</button></div>`;
 setTimeout(()=>{const n=$('#nm');if(n&&!r.users.length)n.focus()},50)}
function pickUser(id){const u=reg().users.find(x=>x.id===id);if(!u)return;loadUser(u);$('#login').classList.remove('open');nav={sec:'home',tab:{learn:'course',practice:'quick',challenge:'boss'},lesson:null};render()}
function createUser(){const n=$('#nm').value.trim();if(!n){toast('กรอกชื่อเล่นก่อนนะ');$('#nm').focus();return}const r=reg(),u={id:'u'+Date.now().toString(36),name:n,avatar:newAv};r.users.push(u);saveReg(r);pickUser(u.id)}
(function boot(){const r=reg(),u=r.users.find(x=>x.id===r.last);if(u){loadUser(u);render()}else showLogin()})();

</script>
